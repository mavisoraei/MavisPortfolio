<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adam Fay</title>
<meta name="description" content="Adam Fay - Art Direction and Illustration">
<link rel="icon" type="image/png" href="meng-to-sketchbook/assets/logo-adam.png">
<link rel="apple-touch-icon" href="meng-to-sketchbook/assets/logo-adam.png">
<link rel="preload" as="image" href="meng-to-sketchbook/assets/faza.webp">
<link rel="preload" as="image" href="meng-to-sketchbook/assets/1.webp">
<link rel="preload" as="image" href="meng-to-sketchbook/assets/2.webp">
<style>
@font-face{font-family:'Instrument Serif';font-style:normal;font-weight:400;font-display:block;
  src:url(meng-to-sketchbook/instrument-serif.woff2) format('woff2')}
@font-face{font-family:'Instrument Serif';font-style:italic;font-weight:400;font-display:block;
  src:url(meng-to-sketchbook/instrument-serif-italic.woff2) format('woff2')}
@font-face{font-family:'Newsreader';font-style:normal;font-weight:200 600;font-display:swap;
  src:url(meng-to-sketchbook/newsreader.woff2) format('woff2')}

:root{
  --paper:#141210;
  --ink:#ffffff;
  --ink-soft:#e5e7eb;
  --ink-faint:#d1d5db;
  --hairline:rgba(255,255,255,.22);
  --earth:#9a6a3e;
  --accent:#c3574b;
  --display:'Instrument Serif',"New York",Georgia,'Times New Roman',serif;
  --font:'Newsreader',"New York",Georgia,'Times New Roman',serif;
  --track-caps:.24em;
  --track-nav:.06em;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font);font-weight:400;background:var(--paper);color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button{font:inherit}
::selection{background:rgba(255,255,255,.9);color:#141210}

/* the painted ground the whole page sits on */
.wash{
  position:fixed;inset:0;z-index:-2;pointer-events:none;
  background-image:url(meng-to-sketchbook/assets/faza.webp);
  background-position:top center;
  background-size:cover;
  background-repeat:no-repeat;
  opacity:.85;
}
.wash:after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.25) 0%,rgba(0,0,0,.72) 58%,#000 88%);
}
/* ---- bulb-only glow over the painted lamp filaments ----
   No artificial cones or overlay light shapes: the painted background
   (faza) already carries the cone visuals, so we only add a soft
   elliptical glow sitting right over each filament.  Positions are
   vw/vh-derived so they ride along with the cover-cropped background. */
.lamp-lights{
  position:fixed;inset:0;z-index:-1;pointer-events:none;
  overflow:hidden;
}
.lamp{
  position:absolute;top:16vh;width:0;height:0;
}
/* pulled slightly inward so the glow centers on the painted bulbs */
.lamp.l{left:19vw}
.lamp.r{right:19vw}
/* soft elliptical filament glow — no rectangle borders, no cone edges */
.lamp .bulb{
  position:absolute;top:0;left:0;transform:translate(-50%,-50%);
  width:24px;height:50px;border-radius:50%;
  background:radial-gradient(ellipse 50% 50% at 50% 50%,
    rgba(255,200,100,.7) 0%,
    rgba(255,200,100,.32) 42%,
    rgba(255,200,100,0) 72%);
  filter:blur(8px);
  mix-blend-mode:screen;
  will-change:opacity;
}
/* subtle natural flicker on the glowing filament only */
.lamp .bulb{animation:naturalFlicker 10s ease-in-out infinite}
.lamp.r .bulb{animation-delay:-3.7s}
@keyframes naturalFlicker{
  0%,12%,100%{opacity:1}
  16%,18%{opacity:.72}
  22%,84%,90%{opacity:.97}
  28%,30%{opacity:.8}
  38%,52%,66%,94%{opacity:1}
  56%,58%{opacity:.62}
  74%,78%{opacity:1}
  96%,98%{opacity:.75}
}
@media (prefers-reduced-motion:reduce){
  .lamp .bulb{animation:none}
}

/* ---------------- top block: avatar + title + nav ---------------- */
.top{
  position:relative;display:grid;justify-items:center;width:100%;
  text-align:center;z-index:3;
}
.top .avatar{
  display:block;width:110px;height:auto;
  margin:0 auto;padding:0;
  /* raw render — no masking, framing, or clipping */
}
.top .headline{text-align:center}
.top .name{
  font-family:var(--display);font-size:clamp(24px,2.4vw,32px);letter-spacing:.01em;
  white-space:nowrap;line-height:1;margin:0;
  /* the monitor line sits right above the name, with breathing room */
  margin-top:5px;
}
.top .menu{
  position:fixed;top:15px;left:50%;transform:translateX(-50%);
  z-index:100;margin:0;
  display:flex;align-items:center;justify-content:center;
  gap:clamp(13px,1.6vw,24px);
  font-size:14px;letter-spacing:var(--track-nav);font-weight:400;
  background:rgba(0,0,0,.42);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.18);
  border-radius:30px;
  padding:8px 20px;
  box-shadow:0 4px 15px rgba(0,0,0,.3);
  opacity:.35;
  transition:opacity .3s ease;
}
.top .menu.scrolled{opacity:.95}
.top .menu a.link{color:var(--ink);opacity:.88;transition:opacity .2s,color .2s}
.top .menu a.link:hover{opacity:1;color:#d4a373}
.top .menu a[aria-current]{color:var(--earth);opacity:1}
.top .menu .menu-sep{width:1px;height:13px;background:var(--hairline)}
.top .menu .top-socials{display:flex;align-items:center;gap:12px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;padding:4px;color:var(--ink-soft);transition:color .2s}
.icon-btn:hover{color:var(--ink)}
.top .icon-btn{width:24px;height:24px;border:1px solid currentColor;border-radius:7px}
.top .icon-btn svg{width:14px;height:14px;display:block}
@media (max-width:640px){
  .top .avatar{width:110px}
  .top .name{font-size:22px;margin-top:5px}
  .top .menu{gap:13px;font-size:13px;flex-wrap:wrap}
  .top .icon-btn{padding:3px}
  .top .icon-btn svg{width:14px;height:14px}
}

/* ---------------- hero ---------------- */
.hero{
  position:relative;display:flex;flex-direction:column;
  justify-content:center;align-items:center;
  width:100%;overflow-anchor:none;
  padding:clamp(70px,8.5svh,104px) 0 clamp(14px,2.5svh,28px);
}
.hero .top{margin-bottom:clamp(12px,1.6svh,20px)}
.botany{
  position:absolute;bottom:0;width:clamp(120px,15vw,250px);opacity:.5;
  pointer-events:none;user-select:none;z-index:0;
}
.botany.l{left:clamp(0px,1vw,24px);bottom:2%}
.botany.r{right:clamp(0px,1vw,20px);bottom:-2%;width:clamp(100px,12vw,200px)}
@media (max-width:900px){.botany{display:none}}

.hero-down{
  position:relative;border:0;background:transparent;
  margin-top:15px;padding:10px 14px;color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent;
  animation:cue-breathe 2.6s ease-in-out infinite;z-index:3;
}
.hero-down:hover{animation:none;opacity:1}
@keyframes cue-breathe{0%,100%{opacity:.15}50%{opacity:.7}}
@media (prefers-reduced-motion:reduce){.hero-down{animation:none;opacity:.5}}

/* ---------------- sketchbook ---------------- */
.hero,.hero *{-webkit-user-select:none;-moz-user-select:none;user-select:none}
.hero img{-webkit-user-drag:none;user-drag:none}
.sb-wrap{display:grid;justify-items:center;gap:12px;width:100%;position:relative;z-index:2;margin-bottom:clamp(12px,1.6svh,20px)}
.sb-stage{
  display:flex;align-items:center;justify-content:center;gap:clamp(6px,1.2vw,20px);width:100%;
  position:relative;
  touch-action:pan-y;
}
.sb-arrow{
  position:absolute;top:50%;transform:translateY(-50%);
  display:inline-flex;align-items:center;justify-content:center;
  width:44px;height:44px;padding:0;
  border:0;background:transparent;color:#f2e8d5;opacity:1;cursor:pointer;
  transition:color .2s,opacity .2s;
  -webkit-tap-highlight-color:transparent;z-index:90;
}
.sb-arrow:hover{color:#fff8ec;opacity:1}
.sb-arrow.left{left:-65px}
.sb-arrow.right{right:-65px}

/* The box is the book's own untransformed frame: the loupe lives here, on
   the desk, while only .sb-tilt leans and scales underneath it. */
.sb-3d{
  position:relative;flex:0 0 auto;min-width:0;
  width:830px;height:378px;max-width:100%;margin:0 auto;
  overflow:visible;
  perspective:1750px;perspective-origin:50% 46%;
}
.sb-tilt{
  position:relative;
  transform-style:preserve-3d;
  transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(var(--zoom,1));
  will-change:transform;
}
.sb-book{position:relative;width:830px;height:378px;max-width:100%;margin:0 auto;aspect-ratio:1760/1240;transform-style:preserve-3d;z-index:1}

/* The book sits on a surface, so its shadow is a soft pool underneath —
   no box, no filter on the artwork, nothing with an edge of its own.
   Both blobs fade to zero well inside their own bounds, and both ease
   off while a leaf is in the air. */
.sb-cast{position:absolute;pointer-events:none;z-index:0}
.sb-cast.ambient{
  left:5%;right:5%;top:27%;bottom:2%;
  background:radial-gradient(50% 50% at 50% 58%,
    rgba(58,44,26,.34) 0%,rgba(58,44,26,.19) 40%,rgba(58,44,26,0) 74%);
  filter:blur(26px);
  opacity:calc(1 - var(--shade,0) * .42);
}
.sb-cast.contact{
  left:9%;right:9%;top:62%;bottom:10%;
  background:radial-gradient(50% 44% at 50% 42%,
    rgba(44,32,14,.40) 0%,rgba(44,32,14,.17) 48%,rgba(44,32,14,0) 78%);
  filter:blur(11px);
  opacity:calc(1 - var(--shade,0) * .5);
}
.sb-cast.hair{
  left:12%;right:12%;top:70%;bottom:17%;
  background:radial-gradient(50% 52% at 50% 40%,
    rgba(40,28,10,.34) 0%,rgba(40,28,10,0) 76%);
  filter:blur(4px);
  opacity:calc(1 - var(--shade,0) * .62);
}
.sb-full{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center}
.sb-full img{width:100%;height:auto;display:block;flex:0 0 auto}
.sb-half{position:absolute;top:0;bottom:0;width:50%;overflow-x:clip;overflow-y:visible;display:flex;flex-direction:column;justify-content:center}
.sb-half.left{left:0}
.sb-half.right{left:50%}
.sb-half-img{width:200%;max-width:none;height:auto;display:block;flex:0 0 auto}
.sb-half-img.right{margin-left:-100%}
/* the shadow the lifting leaf throws onto the page beneath it */
.gutter-shade{
  position:absolute;top:var(--pg,21.8%);bottom:var(--pg,21.8%);width:46%;
  pointer-events:none;opacity:calc(var(--shade,0) * .62);
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 5.2%,#000 94.8%,transparent 100%);
  mask-image:linear-gradient(180deg,transparent 0,#000 5.2%,#000 94.8%,transparent 100%);
}
.gutter-shade.left{right:0;background:linear-gradient(270deg,rgba(52,38,20,.30),rgba(52,38,20,0) 82%)}
.gutter-shade.right{left:0;background:linear-gradient(90deg,rgba(52,38,20,.24),rgba(52,38,20,0) 82%)}

/* ---- the turning leaf: nested strips forming a curved surface ---- */
.curl{
  position:absolute;top:calc((100% - var(--artH,100%)) * .5);height:var(--artH,100%);
  width:calc(var(--bw,0px) * var(--span));
  transform-style:preserve-3d;z-index:6;
}
.curl.next{left:50%;transform-origin:left center;transform:rotateY(calc(-1 * var(--tt,0deg)))}
.curl.prev{right:50%;transform-origin:right center;transform:rotateY(var(--tt,0deg))}
.strip{
  position:absolute;top:0;height:100%;
  width:calc(var(--bw,0px) * var(--span) / var(--n));
  transform-style:preserve-3d;
}
.curl.next .strip{transform-origin:left center}
.curl.prev .strip{transform-origin:right center}
.curl.next>.strip{left:0}
.curl.prev>.strip{right:0;left:auto}
.curl.next .strip .strip{left:100%;transform:rotateY(var(--td,0deg))}
.curl.prev .strip .strip{right:100%;transform:rotateY(calc(-1 * var(--td,0deg)))}
.face{
  position:absolute;top:0;bottom:0;left:0;right:-1.1px;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background-repeat:no-repeat;background-size:var(--bw,0px) auto;
}
.face.back{transform:rotateY(180deg)}
.face .sh,.face .gl{
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 5.2%,#000 94.8%,transparent 100%);
  mask-image:linear-gradient(180deg,transparent 0,#000 5.2%,#000 94.8%,transparent 100%);
}
.strip.edge .face .sh,.strip.edge .face .gl{
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 9%,#000 91%,transparent 100%),var(--hf);
  mask-image:linear-gradient(180deg,transparent 0,#000 9%,#000 91%,transparent 100%),var(--hf);
  -webkit-mask-composite:source-in;mask-composite:intersect;
}
.curl.next .strip.edge .face.front,.curl.prev .strip.edge .face.back{
  --hf:linear-gradient(90deg,#000 0 22%,transparent 96%);
}
.curl.next .strip.edge .face.back,.curl.prev .strip.edge .face.front{
  --hf:linear-gradient(270deg,#000 0 22%,transparent 96%);
}
.face .sh{position:absolute;left:0;right:0;top:var(--pg,21.8%);bottom:var(--pg,21.8%);pointer-events:none}
.curl.next .face.front .sh,.curl.prev .face.back .sh{
  background:linear-gradient(90deg,rgba(58,43,20,var(--a1,0)),rgba(58,43,20,var(--a2,0)));
}
.curl.next .face.back .sh,.curl.prev .face.front .sh{
  background:linear-gradient(90deg,rgba(58,43,20,var(--a2,0)),rgba(58,43,20,var(--a1,0)));
}
.face .gl{
  position:absolute;left:0;right:0;top:var(--pg,21.8%);bottom:var(--pg,21.8%);
  pointer-events:none;background:#fffaf0;
  opacity:calc(var(--shade,0) * var(--lit,1) * var(--lit,1) * .20);
}

/* ---- the loupe: a real magnifier lying on the page.  Pick it up and
       drag it across the book; it stays where you put it. ---- */
.loupe{
  position:absolute;left:0;top:0;
  width:var(--lr,270px);height:var(--lr,270px);
  pointer-events:none;z-index:80;opacity:0;
  transition:opacity .25s ease;
  will-change:transform;
}
.loupe.on{opacity:1}
.loupe.held .ring{cursor:grabbing}
.loupe .ring{
  position:absolute;inset:0;border-radius:50%;
  pointer-events:auto;cursor:grab;
  padding:calc(var(--lr,270px) * .058);
  box-shadow:
    0 1px 2px rgba(58,44,26,.30),
    0 10px 18px rgba(58,44,26,.24),
    0 26px 40px rgba(58,44,26,.20),
    0 48px 66px rgba(58,44,26,.13);
}
/* the bezel is an annulus, so the glass really is see-through */
.loupe .ring:before{
  content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:linear-gradient(146deg,
    #fdf7e9 0%,#e6d7b4 14%,#b69d70 32%,#7d6740 50%,
    #cdbb92 66%,#f4ead3 80%,#9b8459 100%);
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,.8),
    inset 0 -2px 3px rgba(70,52,26,.5);
  -webkit-mask-image:radial-gradient(circle closest-side at 50% 50%,transparent 0 88.2%,#000 89.8% 100%);
  mask-image:radial-gradient(circle closest-side at 50% 50%,transparent 0 88.2%,#000 89.8% 100%);
}
/* the handle, drawn before the bezel so the ring covers its inner end */
.loupe .grip{
  position:absolute;left:50%;top:50%;
  width:calc(var(--lr,270px) * .74);height:calc(var(--lr,270px) * .125);
  transform-origin:0 50%;
  transform:rotate(40deg) translate(calc(var(--lr,270px) * .33),-50%);
  border-radius:calc(var(--lr,270px) * .06);
  pointer-events:auto;cursor:grab;
  background:
    linear-gradient(180deg,rgba(255,255,255,.46) 0 13%,rgba(255,255,255,0) 44%,
                    rgba(0,0,0,.26) 100%),
    linear-gradient(90deg,#d9bd82 0 14%,#a9884e 14% 20%,#6d4c2b 20% 62%,
                    #5a3d22 62% 92%,#7a563180 92% 100%);
  box-shadow:0 8px 15px rgba(58,44,26,.26),0 18px 26px rgba(58,44,26,.14);
}
.lens{
  position:relative;display:block;width:100%;height:100%;border-radius:50%;
  background-repeat:no-repeat;overflow:hidden;
  box-shadow:
    inset 0 0 0 1px rgba(52,40,22,.55),
    inset 0 4px 12px rgba(40,30,14,.28),
    inset 0 -7px 16px rgba(255,250,240,.14);
}
.lens .mag{display:none}
/* A second copy of the book, sitting beside the glass outside the tilt, and
   scaled about whichever page point the glass is currently over. */
.zoomwrap{
  position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:2;
  opacity:0;
}
.zoominner{position:absolute;inset:0;transform-origin:0 0}
.lens:before,.lens:after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none}
.lens:before{z-index:1}
.lens:after{z-index:2}
/* the glass bends and darkens toward its rim, with a faint colour fringe */
.lens:before{
  background:radial-gradient(circle at 50% 50%,
    rgba(0,0,0,0) 54%,rgba(58,44,26,.10) 76%,rgba(46,34,16,.34) 100%);
  box-shadow:
    inset 0 0 0 2px rgba(130,162,196,.26),
    inset 0 0 0 4px rgba(206,158,112,.15);
}
/* the dome: one broad specular and a tight crescent opposite it */
.lens:after{
  background:
    radial-gradient(36% 26% at 29% 19%,rgba(255,255,255,.30),rgba(255,255,255,0) 76%),
    radial-gradient(24% 16% at 74% 86%,rgba(255,255,255,.12),rgba(255,255,255,0) 80%),
    linear-gradient(150deg,rgba(255,255,255,.06) 0 18%,rgba(255,255,255,0) 42%);
}

/* ---- controls ---- */
.sb-tools{
  position:relative;z-index:200;
  display:flex;align-items:center;gap:6px;
  border:1px solid rgba(255,255,255,.28);border-radius:999px;
  padding:5px 7px;background:rgba(255,247,236,.10);
  -webkit-backdrop-filter:blur(10px) saturate(1.1);backdrop-filter:blur(10px) saturate(1.1);
}
.tool{
  width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;
  border:0;border-radius:50%;background:transparent;color:var(--ink-soft);
  cursor:pointer;transition:background-color .18s ease,color .18s ease;
}
.tool:hover{background:rgba(255,255,255,.14);color:var(--ink)}
.tool[aria-pressed="true"]{background:rgba(154,106,62,.16);color:var(--earth)}
.tool:disabled{opacity:.32;cursor:default;background:transparent}
.tool svg{width:15px;height:15px;display:block}
.tool-sep{width:1px;height:17px;background:var(--hairline);margin:0 2px}
.zoom-read{
  font-size:11px;letter-spacing:.1em;color:var(--ink-soft);
  min-width:40px;text-align:center;font-variant-numeric:tabular-nums;
}
@media (pointer:coarse){.loupe{display:none}}

.sb-zone{position:absolute;top:0;bottom:0;border:0;background:transparent;cursor:grab;z-index:60;-webkit-tap-highlight-color:transparent}
.sb-zone:active{cursor:grabbing}
.sb-prev{left:0;width:50%}
.sb-next{right:0;width:50%}

.sb-captions{display:grid;justify-items:center;margin-top:48px}
.sb-captions>*{grid-area:1/1;margin:0}
.sb-caption{font-size:13px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-soft);white-space:nowrap;
  animation:sb-cap-in .5s ease both}
.sb-caption.live{animation:none}
@keyframes sb-cap-in{0%{opacity:0}}
@keyframes sb-cap-out{to{opacity:0}}
/* category line sits directly under the work title */
.sb-cats{
  display:flex;align-items:center;justify-content:center;
  gap:clamp(10px,1.6vw,22px);flex-wrap:wrap;
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:#d1d5db;opacity:.75;white-space:nowrap;
}
.sb-wrap.intro .sb-full img,.sb-wrap.intro .sb-half-img{filter:url(#sb-mblur-1)}
.sb-wrap.intro.b2 .sb-full img,.sb-wrap.intro.b2 .sb-half-img{filter:url(#sb-mblur-2)}
.sb-wrap.intro .sb-caption{animation:none}
.sb-wrap.intro .sb-caption.cap-out{display:none}
@media (max-width:640px){
  .sb-wrap{width:100vw;margin-inline:calc(50% - 50vw)}
  .sb-arrow{width:40px;height:44px;padding:0;z-index:90}
  .sb-arrow.left{left:-40px}
  .sb-arrow.right{right:-40px}
  .sb-3d{height:auto;width:clamp(290px,88vw,520px)}
  .sb-book{height:auto;width:100%;max-height:378px}
  .sb-cats{font-size:9.5px;letter-spacing:.14em}
}

/* ---------------- contact modal ---------------- */
.modal-overlay{
  position:fixed;inset:0;z-index:900;display:grid;place-items:center;padding:20px;
  background:rgba(43,39,33,.30);
  -webkit-backdrop-filter:blur(9px) saturate(.9);backdrop-filter:blur(9px) saturate(.9);
  opacity:0;visibility:hidden;
  transition:opacity .28s ease,visibility .28s ease;
}
.modal-overlay.open{opacity:1;visibility:visible}
.modal{
  position:relative;width:min(500px,100%);
  background:var(--paper);color:var(--ink);
  border-radius:16px;
  padding:clamp(24px,3.2vw,34px);
  border:1px solid rgba(255,255,255,.16);
  box-shadow:0 34px 70px rgba(43,39,33,.32),0 8px 20px rgba(43,39,33,.18);
  transform:translateY(14px) scale(.985);transition:transform .3s ease;
}
.modal-overlay.open .modal{transform:none}
.modal-close{
  position:absolute;top:14px;right:14px;width:34px;height:34px;
  display:inline-flex;align-items:center;justify-content:center;
  border:0;border-radius:50%;background:transparent;color:var(--ink-soft);cursor:pointer;
  transition:background-color .18s ease,color .18s ease;
}
.modal-close:hover{background:rgba(255,255,255,.12);color:var(--ink)}
.modal-close svg{width:16px;height:16px}
.modal h2{
  font-family:var(--display);font-weight:400;
  font-size:clamp(25px,3.2vw,32px);line-height:1.05;margin:0 0 6px;
}
.modal .sub{font-size:14.5px;color:var(--ink-soft);margin:0 0 20px;line-height:1.55}
.modal-form{display:grid;gap:13px}
.field{display:grid;gap:6px}
.field label{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft)}
.field label .req{color:var(--earth)}
.field input,.field textarea{
  width:100%;font:inherit;font-size:16px;color:var(--ink);
  background:rgba(255,255,255,.08);border:1px solid var(--hairline);
  border-radius:9px;padding:11px 13px;outline:0;resize:vertical;
  transition:border-color .18s ease,box-shadow .18s ease,background-color .18s ease;
}
.field input::placeholder,.field textarea::placeholder{color:rgba(255,255,255,.4)}
.field input:focus,.field textarea:focus{

.modal .submit{
  margin-top:4px;justify-self:start;font:inherit;font-size:15px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--paper);
  background:var(--ink);border:0;border-radius:999px;
  padding:12px 30px;cursor:pointer;
  transition:background-color .2s ease,transform .15s ease,box-shadow .2s ease;
}
.modal .submit:hover{background:#c9854f;box-shadow:0 10px 20px rgba(154,106,62,.3)}

.modal .sent{display:none;text-align:center;padding:10px 4px 4px}
.modal.sent .modal-form{display:none}
.modal.sent .sent{display:block}
.sent .sent-icon{

}

.sent h3{font-family:var(--display);font-weight:400;font-size:25px;margin:0 0 6px}
.sent p{font-size:15px;line-height:1.55;color:var(--ink-soft);margin:0 0 22px}

/* ---- resume modal: an A4 page on a blurred dark desk ---- */
.resume-overlay{
  background:rgba(0,0,0,.5);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
}

}

/* ---------------- painted rules + sections ---------------- */
#about,#resume,#plates,.anchor{scroll-margin-top:140px}
.rule{
  display:block;width:min(1080px,86vw);margin:clamp(30px,6vh,64px) auto;
  height:clamp(26px,4vw,46px);
  background:url(meng-to-sketchbook/divider.webp) center / 100% auto no-repeat;
  opacity:.5;
}
.rule.short{width:min(420px,52vw);opacity:.4}
.section-label{
  font-size:11px;letter-spacing:var(--track-caps);text-transform:uppercase;
  color:var(--ink-faint);margin:0 0 18px;
}
.about{
  position:relative;max-width:1080px;margin:0 auto;
  padding:0 clamp(20px,5vw,48px);
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:clamp(24px,5vw,60px);align-items:start;
}
.about>div{min-width:0;overflow:visible}
.bio{
  max-width:550px !important;
  min-width:0;
  white-space:normal !important;
  word-break:break-word !important;
  overflow-wrap:anywhere !important;

  margin:0;
  font-family:var(--font);
  font-size:clamp(1rem,1.6vw,1.15rem);
  line-height:1.7;
  letter-spacing:.005em;
  font-weight:300;
  text-align:left;
  background:transparent;
}
.bio + .bio{margin-top:1em}
.bio-link{color:var(--ink);text-decoration:underline;text-decoration-color:rgba(255,255,255,.35);
  text-underline-offset:4px;transition:text-decoration-color .2s}
.bio-link:hover{text-decoration-color:var(--ink)}

/* ---- glowing bio text (char-by-char reveal) ---- */
.bio-glow{opacity:1}
.bio-glow{
  display:block;
  --glow-text:#e6ddc9;
  --glow-text-dim-end:#e6ddc9;
  --glow-soft:rgba(255,255,255,.336);
  --glow-hard:rgba(255,255,255,.63);
  --glow-settled-weight:300;
}
.glowing-text-word{display:inline-block}
.glowing-text-char{
  display:inline-block;color:var(--glow-text);opacity:0;
  font-weight:var(--glow-settled-weight);
  animation:glowing-char-reveal var(--char-duration) ease-out var(--char-delay) forwards;
}
@keyframes glowing-char-reveal{
  0%{color:var(--glow-text);opacity:0;text-shadow:none}
  55%{color:var(--glow-text);opacity:1;
    text-shadow:0 0 7px var(--glow-hard),0 0 18px var(--glow-hard),0 0 34px var(--glow-hard)}
  100%{color:var(--glow-text);opacity:1;text-shadow:none}
}
.bloom{width:clamp(150px,17vw,260px);height:auto;object-fit:contain;opacity:.9;user-select:none;align-self:center}

  .about{grid-template-columns:1fr}

}

.plates{max-width:1080px;margin:0 auto;padding:0 clamp(20px,5vw,48px)}
.plate-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--hairline);
  display:flex;flex-direction:column;gap:6px}
.plate{
  display:grid;grid-template-columns:3.4em minmax(0,1fr) auto;gap:18px;align-items:baseline;
  width:100%;padding:11px 16px;border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.045);text-align:left;cursor:pointer;color:inherit;
  border-radius:12px;
  transition:background-color .22s ease,padding-left .22s ease,border-color .22s ease,box-shadow .22s ease;
}
.plate:hover,.plate[aria-current="true"]{
  background:rgba(255,255,255,.12);color:#ffffff;padding-left:22px;
  border-color:rgba(255,255,255,.3);box-shadow:0 4px 18px rgba(0,0,0,.18);
}
.plate .n{font-size:12px;color:var(--ink-faint);letter-spacing:var(--track-nav)}
.plate .t{font-family:var(--display);font-size:clamp(19px,2.1vw,26px);white-space:nowrap}
.plate .p{font-size:12.5px;color:var(--ink-faint);letter-spacing:.08em;text-transform:uppercase;text-align:right}
.plate[aria-current="true"] .p{color:var(--earth)}

.foot{font-size:11.5px;letter-spacing:var(--track-caps);text-transform:uppercase;
  color:var(--ink-faint);text-align:center;padding-bottom:44px}

/* mobile-only floating "back to top of section" button (never on desktop) */
#toTop{display:none}

/* ---- expanded plate / sketch items ---- */
.plate-item{position:relative;list-style:none}
.plate-item .plate{position:relative;padding-left:16px;transition:background-color .22s ease,padding-left .22s ease,border-color .22s ease,box-shadow .22s ease}
.plate-item .plate-inner{display:grid;grid-template-columns:3.4em minmax(0,1fr) auto;gap:18px;align-items:baseline;width:100%;grid-column:1/-1}
.plate-item .plate .n{font-size:12px;color:var(--ink-faint);letter-spacing:var(--track-nav)}
.plate-item .plate .t{font-family:var(--display);font-size:clamp(19px,2.1vw,26px);white-space:nowrap}
.plate-item .plate .p{font-size:12.5px;color:var(--ink-faint);letter-spacing:.08em;text-transform:uppercase;text-align:right}
/* circular toggle arrow: down when closed / rotated up when expanded */
.plate .plate-arrow{
  justify-self:end;align-self:center;
  width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(255,255,255,.35);
  background:rgba(255,255,255,.08);
  color:#d1d5db;cursor:pointer;flex:0 0 auto;
  transition:background-color .2s ease,color .2s ease,border-color .2s ease,transform .3s ease;
}
.plate .plate-arrow svg{width:16px;height:16px;display:block;transition:transform .3s ease}
.plate:hover .plate-arrow{background:rgba(255,255,255,.16);color:#ffffff;border-color:rgba(255,255,255,.55)}
.plate-item.expanded .plate-arrow svg{transform:rotate(180deg)}
@media (max-width:640px){
  .plate .t,.plate-item .plate .t{white-space:normal;overflow-wrap:anywhere}
}
.plate-expand{
  display:grid;grid-template-rows:0fr;
  overflow:hidden;padding:0 0 0 3.4em;
  opacity:0;
  transition:grid-template-rows .45s ease,opacity .35s ease;
}
.plate-expand>*{min-height:0}
.plate-item.preview .plate-expand,
.plate-item.expanded .plate-expand{grid-template-rows:1fr;opacity:1}
.plate-content{padding:12px 0 14px;position:relative;min-height:0;overflow:hidden}
.plate-preview{width:100%;max-width:500px;height:auto;border-radius:12px;display:block;
  box-shadow:0 2px 12px rgba(58,44,26,.15)}
/* accordion row copy: white titles, light-gray description */
.plate-thumbs{
  display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:0 0 14px;
  opacity:1;max-height:420px;overflow:hidden;
  transition:opacity .3s ease,max-height .35s ease,margin .35s ease,display .35s ease;
  transition-behavior:allow-discrete;
}
.plate-thumbs img{
  width:100%;height:150px;object-fit:cover;border-radius:12px;display:block;
  background:rgba(255,255,255,.22);
}
/* full expansion: fade the preview thumbnails out and remove them */
.plate-item.expanded .plate-thumbs{opacity:0;max-height:0;margin-top:0;margin-bottom:0;display:none}
/* the full body (gallery / Velma box) only opens on click-pin; hover shows
   just the description + 3 thumbnails */
.plate-body{display:none}
.plate-item.expanded .plate-body{display:block}
/* Section 02 (Velma): expandable placeholder until its sub-categories land */
.plate-placeholder{margin:0;padding:26px 0 30px;font-family:var(--display);font-style:italic;
  font-size:clamp(16px,1.5vw,19px);color:var(--ink-faint);letter-spacing:.02em}
/* vertical scribbled line next to opened plate */
.plate-item.expanded{position:relative}
.plate-item:not(:first-child).expanded::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:repeating-linear-gradient(180deg,
    var(--ink-faint) 0px,var(--ink-faint) 4px,
    transparent 4px,transparent 6px,
    var(--ink-faint) 6px,var(--ink-faint) 11px,
    transparent 11px,transparent 14px);
  opacity:.6;border-radius:2px;
}
/* Gallery plates (01, 03-10) share the Personal Work treatment: no dash,
   and the gallery opens fully with the frame's left edge aligned under the
   first letter of the title.  Section 02 (Velma) keeps the standard slot. */
.plate-item.pw-plate.expanded .plate-expand{animation:none}
.plate-item.pw-plate .plate-expand{padding:0 0 0 calc(3.4em + 34px)}
.plate-item.pw-plate.expanded::before{content:none}
.plate-item.expanded .plate{padding-left:18px}
.plate-item.expanded .plate:hover{padding-left:22px}

/* ---- scroll progress bar for Personal Work (01) ----
   JS tracks Section 01's scroll percentage each frame (rAF-coalesced, so it
   decouples from the scroll repaint cycle) and moves the bar with a single
   GPU-accelerated transform: translate3d(0, Ypx, 0). The li is hard-clipped
   with overflow:hidden, and the clamped Y keeps the whole stroke column
   strictly inside hairline + padding .. grid bottom - padding — it can never
   leave Section 01. The wave is evaluated in CSS from the --p custom prop. */
.plate-item.pw-plate{overflow:hidden}
.work-scroll-progress{
  position:absolute;top:0;left:0;
  width:34px;height:0;overflow:visible;
  z-index:60;pointer-events:none;
  display:none;opacity:0;
  transform:translate3d(0,0,0);
  will-change:transform;                  /* GPU layer: no layout on scroll */
  --lines:28;--n:calc(var(--lines) - 1);
}
.work-scroll-progress.on{display:block;opacity:1}
.work-scroll-progress span{
  position:absolute;left:50%;top:0;
  display:block;width:6px;height:2px;
  background:var(--earth);border-radius:2px;
  opacity:.2;
  transform:translate(-50%,var(--o));
}
@media (prefers-reduced-motion: reduce){
  .work-scroll-progress span{opacity:.18}
}
/* the wave is evaluated entirely in CSS from the --p variable (JS writes it once/frame) */
@supports (opacity: calc(exp(1))){
  .work-scroll-progress span{
    --i:0;
    --g:calc(var(--i) / var(--n));
    --d:calc((var(--p) - var(--g)) * var(--lines) * 1.5);
    --bump:calc(exp(0 - var(--d) * var(--d) * .55));
    --wave:calc(var(--bump) * 6px - 3px);
    width:calc(6px + var(--bump) * 26px);
    opacity:calc(.12 + var(--bump) * .88);
    transform:translate(calc(-50% + var(--wave)),var(--o));
    will-change:width,transform,opacity;
  }
  @media (prefers-reduced-motion: reduce){
    .work-scroll-progress span{width:6px;opacity:.18;transform:translate(-50%,var(--o))}
  }
}

/* ---- glassmorphic masonry gallery for Personal Work (01) ---- */
.pw-gallery{
  background:rgba(255,255,255,.18);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-radius:16px;padding:24px;
  border:1px solid rgba(255,255,255,.35);
  box-shadow:0 10px 30px rgba(0,0,0,.05);
  width:100%;margin:0;
}
.pw-masonry{display:flex;gap:14px;align-items:flex-start;width:100%}
.pw-col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:14px}
.pw-item{margin:0;border-radius:12px;overflow:hidden;background:rgba(255,255,255,.25)}
.pw-item img{width:100%;height:auto;display:block}
@media (max-width:560px){
  .pw-gallery{padding:14px;width:100%}
}

/* ---- Section 02 (Velma): accordion of glassmorphic sub-category grids ----
   Every rule below is scoped under Section 02's unique wrapper
   (.plate-item.velma-plate), so Sections 01 and 03-10 are never affected.
   The glow/hover highlight is confined to the compact header button; expanded
   content (text + masonry grid) is a normal-height block that pushes following
   headers down naturally. ---- */
.plate-item.velma-plate{overflow:hidden}
.plate-item.velma-plate.expanded .plate-expand{animation:none}
/* keep the scribble side-dash off; the GPU-accelerated scroll progress bar stays visible */
.plate-item.velma-plate.expanded::before{content:none}
.plate-item.velma-plate .velma-accordion{display:block}
.plate-item.velma-plate .velma-group{border-top:1px solid var(--hairline);display:block;height:auto;margin:0;padding:0}
.plate-item.velma-plate .velma-head{
  display:block;width:100%;border:1px solid transparent;background:transparent;cursor:pointer;
  color:#d1d5db;
  height:50px;line-height:50px;padding:0 16px;margin:0;text-align:left;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-family:var(--display);font-weight:400;font-size:clamp(17px,1.75vw,21px);letter-spacing:.012em;
  border-radius:12px;
  transition:background-color .2s ease,color .2s ease,border-color .2s ease,transform .2s ease;
}
.plate-item.velma-plate .velma-head-label::before{
  content:"";display:inline-block;width:9px;height:9px;border-radius:50%;
  margin-right:.55em;vertical-align:middle;
  border:1.5px solid var(--earth);background:rgba(154,106,62,.1);
  box-sizing:border-box;
}
.plate-item.velma-plate .velma-head:hover,
.plate-item.velma-plate .velma-group.open .velma-head{
  background:rgba(255,255,255,.12);color:#ffffff;border-color:rgba(255,255,255,.22);
}
.plate-item.velma-plate .velma-caret{
  display:inline-block;width:0;height:0;margin-left:10px;vertical-align:middle;
  border-left:5px solid transparent;border-right:5px solid transparent;border-top:6px solid var(--ink-faint);
  transform:rotate(0);transition:transform .25s ease;
}
.plate-item.velma-plate .velma-group.open .velma-caret{transform:rotate(180deg)}
.plate-item.velma-plate .velma-stage{display:none;height:auto;padding:10px 0 2px;margin:0}
.plate-item.velma-plate .velma-group.open .velma-stage{display:block;animation:velma-stage-in .25s ease}
@keyframes velma-stage-in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.plate-item.velma-plate .velma-note{
  display:block;width:100%;height:auto;padding:0;margin:0 0 14px;
  font-family:var(--font);font-size:clamp(15px,1.45vw,17px);line-height:1.65;
  font-weight:300;color:var(--ink-soft);letter-spacing:.005em;max-width:62ch;
}
.plate-item.velma-plate .velma-gallery{margin:0;width:100%}
/* soft pulse inviting the first click on Marketing while Section 02 is open;
   the glow fills the header button's fixed row only */
.plate-item.velma-plate.expanded .velma-group.cue .velma-head{
  animation:velma-glow 2.2s ease-in-out infinite;
}
@keyframes velma-glow{
  0%,100%{background:rgba(255,252,244,0);box-shadow:0 0 0 0 rgba(154,106,62,0)}
  50%{background:rgba(255,252,244,.2);box-shadow:0 0 16px 2px rgba(154,106,62,.22)}
}
@media (prefers-reduced-motion: reduce){
  .plate-item.velma-plate.expanded .velma-group.cue .velma-head{animation:none}
}
/* ---- global lightbox modal (purely additive; Sections 01-10) ---- */
.pw-item img,.plate-preview{cursor:zoom-in}
.lb{
  position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;
  background:rgba(20,17,12,.8);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .18s ease,visibility .18s ease;
}
.lb.open{opacity:1;visibility:visible;pointer-events:auto}
.lb-frame{margin:0;max-width:min(92vw,1100px);max-height:88vh;
  display:flex;align-items:center;justify-content:center}
.lb-frame img{max-width:92vw;max-height:86vh;width:auto;height:auto;border-radius:6px;
  box-shadow:0 18px 60px rgba(0,0,0,.5)}
.lb-close{
  position:fixed;top:18px;right:20px;z-index:2;width:44px;height:44px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.28);
  background:rgba(255,255,255,.12);color:rgba(255,250,240,.95);font-size:24px;line-height:1;
  cursor:pointer;transition:background-color .15s ease;
}
.lb-close:hover{background:rgba(255,255,255,.25)}
.lb-prev,.lb-next{
  position:fixed;top:50%;transform:translateY(-50%);z-index:2;
  width:52px;height:52px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.12);
  color:rgba(255,250,240,.95);font-size:30px;line-height:1;cursor:pointer;
  transition:background-color .15s ease;
}
.lb-prev{left:20px}.lb-next{right:20px}
.lb-prev:hover,.lb-next:hover{background:rgba(255,255,255,.25)}
.lb-prev.lb-off,.lb-next.lb-off{opacity:.25;pointer-events:none}
@media (max-width:560px){
  .lb-prev{left:8px;width:42px;height:42px;font-size:24px}
  .lb-next{right:8px;width:42px;height:42px;font-size:24px}
  .lb-close{top:10px;right:10px}
}

/* ---- mobile-only polish (768px and under); desktop/tablet untouched ---- */
@media (max-width:768px){
  /* 1. header nav: original default auto width (stretched layout reverted),
        text links and icons enlarged ~10-15%, single centered row */
  .top .menu{
    display:flex;align-items:center;justify-content:center;
    flex-wrap:nowrap;white-space:nowrap;gap:12px;
    font-size:14px;padding:8px 16px;
  }
  .top .menu a.link{white-space:nowrap}
  .top .menu .top-socials{gap:12px}
  .top .menu .icon-btn{width:22px;height:22px}
  .top .menu .icon-btn svg{width:14px;height:14px}

  /* 2. sketchbook: hide side arrows; magnifier zoom stays fully functional,
        white specular circle hidden, lens edge feathered so it blends
        seamlessly into the artwork without hard edges */
  .sb-arrow{display:none}
  /* the loupe's px size is supplied by JS via inline --lr so the zoom mask
        radius and the physical frame always agree; no !important width here */
  .loupe{--mag:1.84;--soft:1;display:block}
  .lens:after{background:none}
  .lens{
    border-radius:50%;
    -webkit-mask-image:radial-gradient(circle, #000 65%, transparent 100%);
    mask-image:radial-gradient(circle, #000 65%, transparent 100%);
    box-shadow:
      inset 0 4px 12px rgba(40,30,14,.28),
      inset 0 -7px 16px rgba(255,250,240,.14),
      inset 0 0 12px rgba(0,0,0,.25);
  }

  /* 3. plates accordion: number + full title forced onto ONE horizontal
        line (!important defeats any wrap/writing-mode rule anywhere);
        the place caption yields so every title has the whole row */
  .plate-inner{display:flex !important;flex-direction:row !important;align-items:center !important;justify-content:flex-start !important;gap:16px !important;width:100% !important}
  .plate-inner .n{flex:0 0 auto !important;width:auto !important;white-space:nowrap !important;writing-mode:horizontal-tb !important;word-break:normal !important;overflow-wrap:normal !important}
  .plate-inner .t{flex:1 1 0 !important;min-width:0 !important;width:auto !important;white-space:nowrap !important;writing-mode:horizontal-tb !important;word-break:normal !important;overflow-wrap:normal !important;font-size:17px}
  .plate-inner .p{display:none}
  .plate-arrow{width:34px !important;height:34px !important}
  .plate-arrow svg{width:14px !important;height:14px !important}
  .plate-thumbs{gap:8px;margin-bottom:12px}
  .plate-thumbs img{height:92px;border-radius:10px}
  .plate-expand{padding-left:0}
  .plate-item.pw-plate .plate-expand{padding-left:10px}
  .plate-content{padding:8px 0 10px}
  .plate-item.velma-plate .velma-head{height:42px;line-height:42px;font-size:16px}
  .plate-item.velma-plate .velma-stage{padding:8px 0 2px}
  .pw-gallery{padding:12px;border-radius:14px}
  .work-scroll-progress{display:none!important}

  /* 4. gallery grids: clean 2-column columns layout in every open plate;
        no empty bands between unequal-height images */
  .pw-masonry{display:block;column-count:2;column-gap:10px}
  .pw-masonry .pw-col{display:contents}
  .pw-masonry .pw-item{break-inside:avoid;-webkit-column-break-inside:avoid;margin:0 0 10px}

  /* 5. floating ↑ button: shows only when a plate is open and the user has
        scrolled down past its header; clicks smooth-scroll back to the top
        of that plate section */
  #toTop{display:flex;position:fixed;bottom:20px;right:20px;z-index:999;
    width:48px;height:48px;align-items:center;justify-content:center;
    border-radius:50%;border:1px solid rgba(255,255,255,.35);
    background:rgba(52,40,22,.82);color:#fff;font-size:20px;line-height:1;
    cursor:pointer;opacity:0;pointer-events:none;transform:translateY(10px);
    transition:opacity .25s ease,transform .25s ease;
    box-shadow:0 6px 18px rgba(0,0,0,.22)}
  #toTop.show{opacity:1;pointer-events:auto;transform:none}

  /* 6. footer: email row on top, location row below, both centered */
  .foot{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
  .foot .foot-mail{order:0}
  .foot .foot-line{order:1}
  .foot .foot-sep{display:none}
}

/* ---- dark-mode text colors (UI/UX accessibility) ---- */
/* primary text: headings, navbar brand, titles, plate titles */
.name,.headline h1,.section-label,.modal h2,.modal h2#contactModalTitle,.sent h3,#contactModalTitle,
.plate .t,.plate-item .plate .t,.top .name{color:#ffffff !important}
/* secondary text: paragraphs, bio, captions, metadata, nav links */
.bio,.foot,.foot-line,.foot-mail,.top .menu a.link,.icon-btn,.sb-caption,.modal .sub,.modal label,.modal p,
.sent p,#contact p,.sub,.velma-note{color:#d1d5db !important;opacity:.95}
/* links / interactive hover states */
.bio-link:hover,.top .menu a.link:hover,.icon-btn:hover,.foot-mail a:hover,.modal a:hover{color:#f3f4f6 !important}
</style>
</head>
<body>
<div class="wash" aria-hidden="true"></div>
<div class="lamp-lights" aria-hidden="true">
  <span class="lamp l"><span class="bulb"></span></span>
  <span class="lamp r"><span class="bulb"></span></span>
</div>
<main class="page home">

  <section id="sketchbook" class="hero">
    <header class="top">
      <img loading="eager" decoding="async" fetchpriority="high" class="avatar" src="meng-to-sketchbook/adam-portrait.webp" alt="Portrait of Adam Fay" width="1385" height="1136">
      <div class="headline">
        <h1 class="name">Adam Fay</h1>
        <nav class="menu" aria-label="Main menu">
          <a href="#sketchbook" class="link" data-nav="home">Home</a>
          <span class="menu-sep" aria-hidden="true"></span>
          <a href="#resume" class="link" data-nav="resume">Resume</a>
          <span class="menu-sep" aria-hidden="true"></span>
          <a href="#contact" class="link" data-nav="contact">Contact</a>
          <span class="menu-sep" aria-hidden="true"></span>
          <span class="top-socials">
            <a href="https://www.linkedin.com/in/adamfay/" class="icon-btn linkedin" aria-label="LinkedIn" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M4.9 3.5a2.1 2.1 0 1 1 0 4.2 2.1 2.1 0 0 1 0-4.2ZM3.1 9.3h3.6v11.6H3.1V9.3Zm6 0h3.4v1.6h.05c.48-.9 1.65-1.85 3.4-1.85 3.63 0 4.3 2.35 4.3 5.4v6.45h-3.6v-5.72c0-1.36-.02-3.12-1.92-3.12-1.92 0-2.22 1.48-2.22 3.02v5.82H9.1V9.3Z"/></svg></a>
            <a href="https://www.instagram.com/adamfaysketch/" class="icon-btn" aria-label="Instagram" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="2.6" y="2.6" width="18.8" height="18.8" rx="5.4"/><circle cx="12" cy="12" r="4.4"/><circle cx="17.6" cy="6.4" r="1.15" fill="currentColor" stroke="none"/></svg></a>
          </span>
        </nav>
      </div>
    </header>

    <div class="sb-wrap" id="sbWrap">
      <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <filter id="sb-mblur-1"><feGaussianBlur stdDeviation="5 0"/></filter>
        <filter id="sb-mblur-2"><feGaussianBlur stdDeviation="14 0"/></filter>
      </svg>
      <div class="sb-stage" id="sbStage">
        <div class="sb-3d" id="sb3d">
          <div class="sb-tilt" id="sbTilt">
            <div class="sb-cast ambient" aria-hidden="true"></div>
            <div class="sb-cast contact" aria-hidden="true"></div>
            <div class="sb-cast hair" aria-hidden="true"></div>
            <div class="sb-book" id="sbBook"></div>
          </div>
          <div class="zoomwrap" id="zoomWrap" aria-hidden="true"><div class="zoominner" id="zoomInner"></div></div>
          <div class="loupe" id="loupe"><span class="grip"></span><span class="ring"><span class="lens" id="loupeLens"><span class="mag" id="loupeMag"></span></span></span></div>
          <button class="sb-arrow left" id="sbLeft" aria-label="previous page">
            <svg viewBox="0 0 14 44" width="14" height="44" fill="none" aria-hidden="true"><polyline points="11,3 3,22 11,41" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="sb-arrow right" id="sbRight" aria-label="next page">
            <svg viewBox="0 0 14 44" width="14" height="44" fill="none" aria-hidden="true"><polyline points="3,3 11,22 3,41" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
      <div class="sb-captions" id="sbCaptions"></div>
      <div class="sb-cats" aria-hidden="true">
        <span>01 Research</span><span>02 Rough</span><span>03 Explore</span><span>04 Define</span><span>05 Final</span>
      </div>
      <div class="sb-tools" role="group" aria-label="view controls">
        <button class="tool" id="zOut" aria-label="zoom out"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="8.6" cy="8.6" r="5.6"/><path d="M12.8 12.8 17.4 17.4M6.2 8.6h4.8"/></svg></button>
        <span class="zoom-read" id="zRead">100%</span>
        <button class="tool" id="zIn" aria-label="zoom in"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="8.6" cy="8.6" r="5.6"/><path d="M12.8 12.8 17.4 17.4M6.2 8.6h4.8M8.6 6.2v4.8"/></svg></button>
        <span class="tool-sep" aria-hidden="true"></span>
        <button class="tool" id="loupeBtn" aria-label="magnifier" aria-pressed="true"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="8.8" cy="8.8" r="5.8"/><path d="M13 13l4.4 4.4"/><path d="M6.4 7.2a3.2 3.2 0 0 1 2.4-1.4" opacity=".55"/></svg></button>
      </div>
    </div>

    <button class="hero-down" id="heroDown" aria-label="scroll to about">
      <svg viewBox="0 0 44 22" width="34" height="17" fill="none" aria-hidden="true">
        <polyline points="3,3 22,11 41,3" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
        <polyline points="3,11 22,19 41,11" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </section>

  <div class="rule" aria-hidden="true"></div>

  <section id="about" class="about">
    <div>
      <p class="section-label">About</p>
      <p class="bio" id="bioOne"></p>
      <p class="bio" id="bioTwo"></p>
    </div>
    <img loading="lazy" decoding="async" class="bloom" src="meng-to-sketchbook/assets/adam-picher.webp" alt="" aria-hidden="true">
  </section>

  <div id="resume" class="anchor"></div>

  <div class="rule short" aria-hidden="true"></div>

  <section id="plates" class="plates">
    <p class="section-label">My Work</p>
    <ol class="plate-list" id="plateList"></ol>
  </section>

  <div class="rule short" aria-hidden="true"></div>
  <p class="foot" id="contact"><span class="foot-line">Los Angeles · Sketchbook</span><span class="foot-sep" aria-hidden="true"> · </span><span class="foot-mail"><a class="bio-link" href="https://www.instagram.com/adamfaysketch/" target="_blank" rel="noopener noreferrer">@adamfaysketch</a></span></p>
</main>

<button class="to-top" id="toTop" type="button" aria-label="Back to top of section">&#8593;</button>

<div class="modal-overlay" id="contactModal" role="dialog" aria-modal="true" aria-labelledby="contactModalTitle">
  <div class="modal" id="contactModalBox">
    <button class="modal-close" id="modalClose" aria-label="Close contact form">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4.5 4.5 15.5 15.5M15.5 4.5 4.5 15.5"/></svg>
    </button>
    <h2 id="contactModalTitle">Get in touch</h2>
    <p class="sub">Have a project in mind? Tell me a little about it.</p>
    <form class="modal-form" id="contactForm" novalidate>
      <div class="field">
        <label for="cfName">Name <span class="req">*</span></label>
        <input id="cfName" name="name" type="text" required maxlength="80" autocomplete="name" placeholder="Your name">
      </div>
      <div class="field">
        <label for="cfEmail">Email Address <span class="req">*</span></label>
        <input id="cfEmail" name="email" type="email" required maxlength="120" autocomplete="email" placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="cfMsg">Message <span class="req">*</span></label>
        <textarea id="cfMsg" name="message" rows="5" required maxlength="1200" placeholder="Tell me about your project..."></textarea>
      </div>
      <button class="submit" type="submit">Submit</button>
    </form>
    <div class="sent" id="modalSent" role="status">
      <span class="sent-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5 9.6 17.5 19.5 7"/></svg>
      </span>
      <h3 tabindex="-1">Message sent</h3>
      <p>Thanks for reaching out — I'll get back to you soon.</p>
      <button class="submit" id="sentClose" type="button">Close</button>
    </div>
  </div>
</div>

<div class="modal-overlay resume-overlay" id="resumeModal" role="dialog" aria-modal="true" aria-labelledby="resumeModalTitle">
  <button class="resume-close" id="resumeClose" aria-label="Close resume">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4.5 4.5 15.5 15.5M15.5 4.5 4.5 15.5"/></svg>
  </button>
  <img loading="lazy" decoding="async" class="resume-img" src="meng-to-sketchbook/assets/Resume.webp" alt="Adam Fay — Resume">
</div>

<script defer src="meng-to-sketchbook/landing.js"></script>
</body>
</html>
